[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketbudget"
version = "1.2.0"
description = "Traceable seven-day vegetable procurement budgets for Dambulla"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3", "numpy==2.3.5", "lightgbm==4.6.0",
  "fastapi==0.141.1", "uvicorn==0.52.1", "httpx==0.28.1",
  "pymupdf==1.26.6", "pyreadr==0.5.4"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["marketbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]

